apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-postgresql
spec:
  # Se utiliza la imagen oficial del proveedor de PostgreSQL de Upbound
  package: xpkg.upbound.io/upbound/provider-postgresql:v0.5.0
---
apiVersion: postgresql.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Aquí especificas cómo se conecta Crossplane a tu servidor PostgreSQL real
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: postgresql-creds # El secreto con el host, usuario y password
      key: credentials
