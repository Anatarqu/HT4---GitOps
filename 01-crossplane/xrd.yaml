#@'
# =====================================================================
# Crossplane XRD — CompositeResourceDefinition
# =====================================================================
# Realizado: XRD para aprovisionamiento de PostgreSQL
#
# Este XRD define:
#   - Un Composite Resource llamado XPostgreSQLInstance
#   - Parámetros configurables: dbName y owner
#   - El grupo database.poc.io y la versión v1alpha1
# =====================================================================

apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgresqlinstances.database.poc.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: database.poc.io
  names:
    kind: XPostgreSQLInstance
    plural: xpostgresqlinstances
  claimNames:
    kind: PostgreSQLInstance
    plural: postgresqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - dbName
                - owner
              properties:
                dbName:
                  type: string
                  description: Nombre de la base de datos PostgreSQL que se creará de forma dinámica.
                  minLength: 3
                  maxLength: 63
                owner:
                  type: string
                  description: Nombre del usuario o rol propietario de la base de datos.
                  default: postgres
'@ | Set-Content .\01-crossplane\xrd.yaml -Encoding UTF8